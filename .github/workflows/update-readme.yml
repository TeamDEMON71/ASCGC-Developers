name: Update Developer Directory

on:
  push:
    branches:
      - main
    paths:
      - "students/*.json"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README tables
        run: python scripts/update_readme.py

      - name: Commit and push README updates
        run: |
          if git diff --quiet -- README.md README.bn.md random.json students.json; then
            echo "README files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.bn.md random.json students.json
          git commit -m "chore: update student directory"
          git push
